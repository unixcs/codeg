name: Fork release (auto-sync upstream)

# 当上游 spacering-net/codeg 发布新 release 时自动：
#   1. 定时（每 6 小时）+ dispatch 检查上游 latest；同一上游基版本只发一次
#   2. 在 CI 里把上游 tag 合并进 deploy/fork-updater（含 ZCode 补丁+fork 更新源）
#   3. 干净合并后回写 deploy/fork-updater（保留 fork 自己的 workflows）
#   4. 构建 linux-x64/arm64 服务端包，用 fork 自己的 minisign 密钥签名，
#      生成 latest.json 并连同 tarball/.sig/.sha256 发到 fork 同名 release
# tx/nas/dell 上的 codeg 检查 fork 的 releases/latest，走自带的一键更新。
#
# 注意：合并时恢复 fork 自己的 .github/workflows，避免把上游 workflow 改动
# 带进 push（也省掉 workflow scope 依赖）。冲突时 job 标红，Summary 里有
# 可直接粘贴的恢复命令，需人工解决。

on:
  schedule:
    # 每 6 小时主动查一次上游；比依赖 NAS 的 repository_dispatch 稳。
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      arm_only:
        description: "只给最新 fork release 补 arm64 包（跳过 x64 重建）"
        type: boolean
        default: false
      force:
        description: "上游基版本已发过也强制重建（默认跳过）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  ARTIFACT: codeg-server-linux-x64

jobs:
  sync-and-release:
    # arm64 job 直接复用这里算出的 tag。让它自己再去 release 列表里猜"最新
    # fork release"，上游换基版本时会猜中旧的 0.38.0+fork.7（fork 序号更大），
    # 误判"arm64 已存在"而跳过，新 release 就永远缺 arm64 包，且整次运行全绿。
    outputs:
      tag: ${{ steps.forkver.outputs.tag }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.arm_only) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy/fork-updater
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve upstream latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          info=$(gh api repos/spacering-net/codeg/releases/latest --jq '{tag: .tag_name, ver: (.tag_name | ltrimstr("v")), notes: .body}')
          echo "tag=$(echo "$info" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "ver=$(echo "$info" | jq -r .ver)" >> "$GITHUB_OUTPUT"
          echo "$info" | jq -r .notes > /tmp/upstream-notes.md
          echo "Upstream: $(echo "$info" | jq -r .tag)"

      - name: Compute fork build number
        id: forkver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The in-place updater refuses a same-version reinstall (it would
          # destroy the rollback .bak), so every fork build gets a semver-new
          # build number. Upstream 0.38.0 -> fork 0.38.1001, 0.38.1002, ...:
          # the patch slot carries 1000+N, which sits above any upstream
          # patch (0.38.1 < 0.38.1001), keeps plain 3-part semver that Cargo
          # accepts, and stays readable as the upstream base.
          base="${{ steps.upstream.outputs.ver }}"
          minor="${base%.*}"
          # 序号按整条 minor 线累计，而不是按基版本累计：0.41.3 出过 0.41.1001
          # 之后上游发 0.41.4，若重新从 1 数就会再发一版 0.41.1001——已装机器
          # is_newer 判 false，永远看不到这个包（静默停更）。
          n=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' | grep -F "${minor}." | grep -cF "+fork." || true)
          n=$((n + 1))
          build=$((1000 + n))
          # strip the trailing ".0" (upstream .0 patch) so the build number
          # lands in the patch slot: 0.38.0 -> 0.38.<1000+N>
          forkver="${base%.*}.${build}"
          echo "forkver=$forkver" >> "$GITHUB_OUTPUT"
          echo "tag=${base}+fork.${n}" >> "$GITHUB_OUTPUT"
          # Idempotency: a schedule run must not publish a new build every 6h.
          # N is cumulative across the minor line, so the next N never exists;
          # key the skip on the upstream BASE instead.
          base_has=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' | grep -cF "${base}+fork." || true)
          echo "base_has=$base_has" >> "$GITHUB_OUTPUT"
          echo "Fork version: $forkver (tag ${base}+fork.${n}, build #$n, base releases #$base_has)"

      - name: Skip if this upstream base already has a fork release
        id: skip
        run: |
          set -euo pipefail
          # N is cumulative across the minor line, so `${base}+fork.${n}` is
          # always new and can never detect a repeat. Skip when the upstream
          # BASE already has any fork release, unless force=true.
          if [ "${{ inputs.force }}" != "true" ] && [ "${{ steps.forkver.outputs.base_has }}" != "0" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Upstream ${{ steps.upstream.outputs.ver }} already has a fork release — skipping (force=true to rebuild)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream tag
        if: steps.skip.outputs.already == 'false'
        id: merge
        run: |
          set -euo pipefail
          git config user.name "fork-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/spacering-net/codeg.git
          git fetch upstream "${{ steps.upstream.outputs.tag }}"
          if git merge --no-ff --no-edit FETCH_HEAD; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git log --oneline -1
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the clean merge back to deploy branch
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          # Keep the fork's own workflows: upstream's .github changes would
          # otherwise require a `workflow`-scoped token. Restore the pre-merge
          # copy and amend the merge commit so the pushed tree never carries
          # upstream workflows.
          git checkout HEAD^1 -- .github/workflows
          git add .github/workflows
          git commit --amend --no-edit
          git push origin HEAD:deploy/fork-updater

      - name: Report merge conflict (fails the run on purpose)
        # Issues are disabled on this fork, so the old `gh issue create` could
        # only ever fail: the red X it produced was the only signal and it
        # carried no readable reason. Write the exact recovery steps into the
        # run summary, then fail explicitly so the run still goes red.
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'false'
        run: |
          {
            echo "## ⚠️ 上游 ${{ steps.upstream.outputs.tag }} 合并冲突，本次未出包"
            echo ""
            echo '```bash'
            echo "cd /mnt/Projects/codeg/repo && git fetch upstream --tags"
            echo "git checkout deploy/fork-updater"
            echo "git merge ${{ steps.upstream.outputs.tag }}"
            echo "# 解决冲突（保住 ZCode 补丁与 fork 更新源补丁）→ push → 重跑本 workflow"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::上游 ${{ steps.upstream.outputs.tag }} 合并冲突，未出包——处理步骤见本次运行的 Summary"
          exit 1

      - name: Stamp fork version into build inputs
        # CARGO_PKG_VERSION 是编译期烙进二进制的（update.rs 的 currentVersion），
        # 只在 latest.json 写版本号会让已装机器永远看到"有更新"。必须在
        # cargo/pnpm 构建前把 forkver 写进版本源，二进制才真正自称新版本。
        # Cargo.lock 同步改，避免 lock 校验失败；JSON 用定点替换保留上游紧凑排版。
        # 顺序很关键：必须在 Build frontend 之前，否则网页包内联的
        # CODEG_APP_VERSION（next.config.ts 读 package.json）仍是上游版本，
        # 页面打开就报"服务器已运行 X，此页面仍是 Y"。
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          VER: ${{ steps.forkver.outputs.forkver }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${VER}\"/" src-tauri/Cargo.toml
          grep -q "^version = \"${VER}\"" src-tauri/Cargo.toml
          python3 - "$VER" <<'EOF'
          import sys
          ver = sys.argv[1]
          # Cargo.lock: bump the fork's own package entry — it's the only
          # [[package]] named "codeg" (other crates carry a vendor prefix).
          lines = open("src-tauri/Cargo.lock").read().split("\n")
          hits = [i for i, line in enumerate(lines) if line == 'name = "codeg"']
          assert len(hits) == 1, f'expected exactly one "codeg" entry, found {len(hits)}'
          i = hits[0]
          assert lines[i + 1].startswith("version = "), f"unexpected lock layout at line {i}"
          lines[i + 1] = f'version = "{ver}"'
          open("src-tauri/Cargo.lock", "w").write("\n".join(lines))
          # The version being replaced is whatever upstream shipped (0.38.0,
          # 0.41.3, ...), so match the field itself instead of hard-coding a
          # release number: a stale needle tripped the assert and killed the
          # whole release without building anything.
          import re
          for path in ("src-tauri/tauri.conf.json", "package.json"):
              text = open(path).read()
              new, n = re.subn(r'("version"\s*:\s*)"[^"]*"', r'\1"' + ver + '"', text, count=1)
              assert n == 1, f"no top-level version field in {path}"
              # spot replace keeps upstream's compact formatting intact
              open(path, "w").write(new)
          EOF
          grep "\"version\": \"${VER}\"" src-tauri/tauri.conf.json package.json
          grep -A1 '^name = "codeg"$' src-tauri/Cargo.lock | head -2

      - name: Install pnpm deps
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: pnpm build

      - name: Set up Rust
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build server + companions (mirror official release.yml)
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          cd src-tauri
          cargo build --release --bin codeg-server --no-default-features --features server-bin
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin
          cd ..
          mkdir -p dist/${ARTIFACT}
          cp src-tauri/target/release/codeg-server dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-mcp dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-computer-helper dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-cli dist/${ARTIFACT}/
          chmod +x dist/${ARTIFACT}/*
          cp -r out dist/${ARTIFACT}/web
          cd dist && tar czf ${ARTIFACT}.tar.gz ${ARTIFACT}

      - name: Smoke test packaged artifact
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          test -x "dist/${ARTIFACT}/codeg-server"
          test -x "dist/${ARTIFACT}/codeg-mcp"
          test -x "dist/${ARTIFACT}/codeg-computer-helper"
          test -x "dist/${ARTIFACT}/codeg-cli"
          test -f "dist/${ARTIFACT}/web/index.html"
          # 二进制必须自称 forkver。latest.json 说新、二进制说旧是这条流水线
          # 最隐蔽的失败：已装机器永远看不到更新（CARGO_PKG_VERSION 编译期定死）。
          "dist/${ARTIFACT}/codeg-server" --version | grep -qF "${{ steps.forkver.outputs.forkver }}"

      - name: Sign bundle with fork key
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          pnpm tauri signer sign --app-version "${{ steps.forkver.outputs.forkver }}" "dist/${ARTIFACT}.tar.gz"
          test -f "dist/${ARTIFACT}.tar.gz.sig"
          ( cd dist && sha256sum ${ARTIFACT}.tar.gz > ${ARTIFACT}.tar.gz.sha256 )

      - name: Build latest.json
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          VER: ${{ steps.forkver.outputs.forkver }}
        run: |
          set -euo pipefail
          # `.sig` 本身就是 minisign 文本的 base64（tauri signer 的产物），
          # 再 base64 一次就是双层编码：Tauri 桌面更新器解一次后拿到单行
          # base64 而不是 4 行 minisign 文档，直接 InvalidEncoding。
          # 服务器更新器不读这个字段（它另下 .sig 资产），所以只影响桌面端，
          # 但保持与上游 latest.json 同一约定没有代价。
          SIG=$(tr -d '\n\r' < "dist/${ARTIFACT}.tar.gz.sig")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.forkver.outputs.tag }}/${ARTIFACT}.tar.gz"
          jq -n --arg v "$VER" --arg s "$SIG" --arg u "$URL" --rawfile n /tmp/upstream-notes.md \
            '{version: $v, notes: $n, pub_date: (now | todateiso8601),
              platforms: {"linux-x86_64": {signature: $s, url: $u}}}' > dist/latest.json
          jq -r '.version, .platforms["linux-x86_64"].url' dist/latest.json

      - name: Create fork release and upload
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.forkver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "codeg ${{ steps.forkver.outputs.forkver }} + zcode-pin (fork)" \
            --notes "基于上游 ${{ steps.upstream.outputs.tag }}，含 ZCode 0.72.0 补丁与 fork 更新源。打包 linux-x64 与 linux-arm64。fork 构建号 ${{ steps.forkver.outputs.forkver }}（is_newer 可见，覆盖安装不再被同版本拒绝）。

          $(cat /tmp/upstream-notes.md)" \
            "dist/${ARTIFACT}.tar.gz" \
            "dist/${ARTIFACT}.tar.gz.sig" \
            "dist/${ARTIFACT}.tar.gz.sha256" \
            dist/latest.json

  # ARM64 服务端包（NAS / 树莓派等 arm64 Linux）。等 x64 job 发布 release 和
  # latest.json 后再跑：复用同一 tag/版本号，把 arm64 三件套（tar/sig/sha256）
  # 追加到同一个 release。更新器按 releases/latest/download/<asset> 取包，所以
  # 不需要改 latest.json 的 platforms。
  #
  # 用原生 arm runner + Debian 12 容器：目标机（Armbian bookworm）glibc 2.36，
  # 若在 ubuntu-24.04 裸机构建会引入 GLIBC_2.38 符号而跑不起来。web 静态资产
  # 与架构无关，直接复用 x64 包里的那份，避免在容器里再装一套 Node/pnpm。
  build-arm64:
    needs: sync-and-release
    if: ${{ !cancelled() && (needs.sync-and-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.arm_only == true)) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container: arm64v8/debian:12
    env:
      ARTIFACT: codeg-server-linux-arm64
    defaults:
      run:
        # Container jobs default to /bin/sh (dash); the steps use bashisms
        # (pipefail) and `set -euo pipefail`.
        shell: bash
        # Be explicit: container jobs have been observed running run-steps
        # outside the checked-out workspace, which makes `git config` fail
        # with "not in a git directory".
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev git curl ca-certificates jq gh \
            nodejs npm file python3

      - name: Resolve the release the x64 job just published
        id: rel
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 主路：直接沿用 x64 job 算出的 tag，它就是本次要补 arm64 包的 release。
          # 兜底（arm_only=true 时 x64 job 被 skip，output 为空）：先比上游基版本、
          # 再比 fork 序号。只按 fork 序号排会选中 n 更大的旧基版本（0.38.0+fork.7），
          # arm64 被误判"已存在"而跳过；也别按 created_at，同一提交时间相同，
          # 稳定排序的 last 会取到旧版本（批v91 实锤）。jq 的数组比较是字典序，
          # [0,41,3] > [0,38,0]，所以基版本优先。
          tag="${{ needs.sync-and-release.outputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.tag_name | contains("+fork."))] | sort_by([(.tag_name | split("+fork.")[0] | split(".") | map(tonumber)), (.tag_name | capture("fork\\.(?<n>[0-9]+)$").n | tonumber)]) | last | .tag_name')
          fi
          test -n "$tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output /tmp/latest.json --clobber
          ver=$(jq -r .version /tmp/latest.json)
          test -n "$ver"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -qx "${ARTIFACT}.tar.gz"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "arm64 assets already on $tag — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "ARM64 build for $tag (version $ver)"

      - name: Check out deploy branch
        if: steps.rel.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: deploy/fork-updater
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Mark workspace safe for git
        if: steps.rel.outputs.skip == 'false'
        run: |
          # The container runs as root while checkout leaves the tree owned by
          # the runner user; checkout's own safe.directory entry lives in a
          # temporary HOME and does not reach later steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Merge the same upstream tag the x64 job used
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # release tag "0.38.0+fork.3" -> upstream tag "v0.38.0"
          upstream_tag="v${{ steps.rel.outputs.tag }}"
          upstream_tag="${upstream_tag%%+*}"
          git config user.name "fork-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/spacering-net/codeg.git
          git fetch upstream "$upstream_tag"
          git merge --no-edit FETCH_HEAD

      - name: Stamp fork version into build inputs
        if: steps.rel.outputs.skip == 'false'
        env:
          VER: ${{ steps.rel.outputs.ver }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sed -i "0,/^version = \".*\"/s//version = \"${VER}\"/" src-tauri/Cargo.toml
          grep -q "^version = \"${VER}\"" src-tauri/Cargo.toml
          python3 - "$VER" <<'EOF'
          import sys
          ver = sys.argv[1]
          lines = open("src-tauri/Cargo.lock").read().split("\n")
          hits = [i for i, line in enumerate(lines) if line == 'name = "codeg"']
          assert len(hits) == 1, f'expected exactly one "codeg" entry, found {len(hits)}'
          i = hits[0]
          assert lines[i + 1].startswith("version = "), f"unexpected lock layout at line {i}"
          lines[i + 1] = f'version = "{ver}"'
          open("src-tauri/Cargo.lock", "w").write("\n".join(lines))
          # The version being replaced is whatever upstream shipped (0.38.0,
          # 0.41.3, ...), so match the field itself instead of hard-coding a
          # release number: a stale needle tripped the assert and killed the
          # whole release without building anything.
          import re
          for path in ("src-tauri/tauri.conf.json", "package.json"):
              text = open(path).read()
              new, n = re.subn(r'("version"\s*:\s*)"[^"]*"', r'\1"' + ver + '"', text, count=1)
              assert n == 1, f"no top-level version field in {path}"
              open(path, "w").write(new)
          EOF
          grep "\"version\": \"${VER}\"" src-tauri/tauri.conf.json package.json
          grep -A1 '^name = "codeg"$' src-tauri/Cargo.lock | head -2

      - name: Set up Rust
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build arm64 server + companions
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src-tauri"
          cargo build --release --bin codeg-server --no-default-features --features server-bin
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin
          cd ..
          mkdir -p dist/${ARTIFACT}
          cp src-tauri/target/release/codeg-server dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-mcp dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-computer-helper dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-cli dist/${ARTIFACT}/
          chmod +x dist/${ARTIFACT}/*

      - name: Reuse the architecture-independent web assets
        if: steps.rel.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release download "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern codeg-server-linux-x64.tar.gz --output /tmp/x64.tar.gz --clobber
          mkdir -p dist/web-src
          tar xzf /tmp/x64.tar.gz -C dist/web-src --strip-components=1 codeg-server-linux-x64/web
          mv dist/web-src/web dist/${ARTIFACT}/web
          rmdir dist/web-src
          cd dist && tar czf ${ARTIFACT}.tar.gz ${ARTIFACT}

      - name: Smoke test packaged artifact
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -x "dist/${ARTIFACT}/codeg-server"
          test -x "dist/${ARTIFACT}/codeg-mcp"
          test -x "dist/${ARTIFACT}/codeg-computer-helper"
          test -x "dist/${ARTIFACT}/codeg-cli"
          test -f "dist/${ARTIFACT}/web/index.html"
          file "dist/${ARTIFACT}/codeg-server" | grep -q "ARM aarch64"
          # 与 x64 job 同理：二进制必须自称 latest.json 里那个版本。
          "dist/${ARTIFACT}/codeg-server" --version | grep -qF "${{ steps.rel.outputs.ver }}"

      - name: Sign bundle with fork key
        if: steps.rel.outputs.skip == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npm install -g @tauri-apps/cli@2 >/tmp/npm-tauri.log 2>&1 || { tail -50 /tmp/npm-tauri.log; exit 1; }
          tauri signer sign --app-version "${{ steps.rel.outputs.ver }}" "dist/${ARTIFACT}.tar.gz"
          test -f "dist/${ARTIFACT}.tar.gz.sig"
          ( cd dist && sha256sum ${ARTIFACT}.tar.gz > ${ARTIFACT}.tar.gz.sha256 )

      - name: Upload arm64 assets to the same release
        if: steps.rel.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release upload "${{ steps.rel.outputs.tag }}" \
            "dist/${ARTIFACT}.tar.gz" \
            "dist/${ARTIFACT}.tar.gz.sig" \
            "dist/${ARTIFACT}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

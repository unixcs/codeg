name: Fork release (auto-sync upstream)

# 当上游 spacering-net/codeg 发布新 release 时自动：
#   1. 在 CI 里把上游 tag 合并进 deploy/fork-updater（含 fork 更新源补丁+悬浮球）
#   2. 构建 linux-x64 服务端包（codeg-server + codeg-mcp + codeg-cli
#      + codeg-computer-helper + web 静态资产），与官方 tarball 同构
#   3. 用 fork 自己的 minisign 密钥签名（--app-version 绑定版本）
#   4. 生成 latest.json 并连同 tarball/.sig/.sha256 发到 fork 的同名 release
# tx/dell 上的 codeg 检查的是 fork 的 releases/latest，走它自带的一键更新。
#
# 注意：合并结果**不回推** deploy 分支——GITHUB_TOKEN 无 workflows 权限，
# 合并若带入 .github/workflows 改动，push 必被拒。deploy 分支的源码由
# 人工维护（上游合并有冲突时本地解决后 push），CI 每次都从上游 tag 现合。
# 冲突时合并失败 → job 标红 + 开 issue 通知，需人工解决。

on:
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      arm_only:
        description: "只给最新 fork release 补 arm64 包（跳过 x64 重建）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  ARTIFACT: codeg-server-linux-x64

jobs:
  sync-and-release:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.arm_only) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy/fork-updater
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve upstream latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          info=$(gh api repos/spacering-net/codeg/releases/latest --jq '{tag: .tag_name, ver: (.tag_name | ltrimstr("v")), notes: .body}')
          echo "tag=$(echo "$info" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "ver=$(echo "$info" | jq -r .ver)" >> "$GITHUB_OUTPUT"
          echo "$info" | jq -r .notes > /tmp/upstream-notes.md
          echo "Upstream: $(echo "$info" | jq -r .tag)"

      - name: Compute fork build number
        id: forkver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The in-place updater refuses a same-version reinstall (it would
          # destroy the rollback .bak), so every fork build gets a semver-new
          # build number. Upstream 0.38.0 -> fork 0.38.1001, 0.38.1002, ...:
          # the patch slot carries 1000+N, which sits above any upstream
          # patch (0.38.1 < 0.38.1001), keeps plain 3-part semver that Cargo
          # accepts, and stays readable as the upstream base.
          base="${{ steps.upstream.outputs.ver }}"
          n=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name | startswith(\"${base}+fork.\"))] | length" 2>/dev/null || echo 0)
          n=$((n + 1))
          build=$((1000 + n))
          # strip the trailing ".0" (upstream .0 patch) so the build number
          # lands in the patch slot: 0.38.0 -> 0.38.<1000+N>
          forkver="${base%.*}.${build}"
          echo "forkver=$forkver" >> "$GITHUB_OUTPUT"
          echo "tag=${base}+fork.${n}" >> "$GITHUB_OUTPUT"
          echo "Fork version: $forkver (tag ${base}+fork.${n}, build #$n)"

      - name: Skip if fork already has this release
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.forkver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.forkver.outputs.tag }} already exists on fork — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream tag (local only, not pushed back)
        if: steps.skip.outputs.already == 'false'
        id: merge
        run: |
          set -euo pipefail
          git config user.name "fork-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/spacering-net/codeg.git
          git fetch upstream "${{ steps.upstream.outputs.tag }}"
          if git merge --no-edit FETCH_HEAD; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git log --oneline -1
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on merge conflict
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "上游 ${{ steps.upstream.outputs.tag }} 合并冲突，需人工介入" \
            --body "spacering-net/codeg 发布了 ${{ steps.upstream.outputs.tag }}，CI 合并进 deploy/fork-updater 时有冲突，本次未出包。请在本地：git fetch upstream && git merge ${{ steps.upstream.outputs.tag }}，解决冲突（保留悬浮球与 fork 更新源补丁）后 push 到 deploy 分支，然后手动重跑 workflow。"

      - name: Install pnpm deps
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: pnpm build

      - name: Set up Rust
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp fork version into build inputs
        # CARGO_PKG_VERSION 是编译期烙进二进制的（update.rs 的 currentVersion），
        # 只在 latest.json 写版本号会让已装机器永远看到"有更新"。必须在
        # cargo/pnpm 构建前把 forkver 写进版本源，二进制才真正自称新版本。
        # Cargo.lock 同步改，避免 lock 校验失败；JSON 用定点替换保留上游紧凑排版。
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          VER: ${{ steps.forkver.outputs.forkver }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${VER}\"/" src-tauri/Cargo.toml
          grep -q "^version = \"${VER}\"" src-tauri/Cargo.toml
          python3 - "$VER" <<'EOF'
          import sys
          ver = sys.argv[1]
          # Cargo.lock: bump the fork's own package entry — it's the only
          # [[package]] named "codeg" (other crates carry a vendor prefix).
          lines = open("src-tauri/Cargo.lock").read().split("\n")
          hits = [i for i, line in enumerate(lines) if line == 'name = "codeg"']
          assert len(hits) == 1, f'expected exactly one "codeg" entry, found {len(hits)}'
          i = hits[0]
          assert lines[i + 1].startswith("version = "), f"unexpected lock layout at line {i}"
          lines[i + 1] = f'version = "{ver}"'
          open("src-tauri/Cargo.lock", "w").write("\n".join(lines))
          for path in ("src-tauri/tauri.conf.json", "package.json"):
              text = open(path).read()
              needle = '"version": "0.38.0"'
              assert text.count(needle) == 1, f"expected one version field in {path}"
              # spot replace keeps upstream's compact formatting intact
              open(path, "w").write(text.replace(needle, f'"version": "{ver}"'))
          EOF
          grep "\"version\": \"${VER}\"" src-tauri/tauri.conf.json package.json
          grep -A1 '^name = "codeg"$' src-tauri/Cargo.lock | head -2

      - name: Build server + companions (mirror official release.yml)
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          cd src-tauri
          cargo build --release --bin codeg-server --no-default-features --features server-bin
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin
          cd ..
          mkdir -p dist/${ARTIFACT}
          cp src-tauri/target/release/codeg-server dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-mcp dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-computer-helper dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-cli dist/${ARTIFACT}/
          chmod +x dist/${ARTIFACT}/*
          cp -r out dist/${ARTIFACT}/web
          cd dist && tar czf ${ARTIFACT}.tar.gz ${ARTIFACT}

      - name: Smoke test packaged artifact
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          test -x "dist/${ARTIFACT}/codeg-server"
          test -x "dist/${ARTIFACT}/codeg-mcp"
          test -x "dist/${ARTIFACT}/codeg-computer-helper"
          test -x "dist/${ARTIFACT}/codeg-cli"
          test -f "dist/${ARTIFACT}/web/index.html"

      - name: Sign bundle with fork key
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          pnpm tauri signer sign --app-version "${{ steps.forkver.outputs.forkver }}" "dist/${ARTIFACT}.tar.gz"
          test -f "dist/${ARTIFACT}.tar.gz.sig"
          ( cd dist && sha256sum ${ARTIFACT}.tar.gz > ${ARTIFACT}.tar.gz.sha256 )

      - name: Build latest.json
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          VER: ${{ steps.forkver.outputs.forkver }}
        run: |
          set -euo pipefail
          SIG=$(base64 -w0 "dist/${ARTIFACT}.tar.gz.sig")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.forkver.outputs.tag }}/${ARTIFACT}.tar.gz"
          jq -n --arg v "$VER" --arg s "$SIG" --arg u "$URL" --rawfile n /tmp/upstream-notes.md \
            '{version: $v, notes: $n, pub_date: (now | todateiso8601),
              platforms: {"linux-x86_64": {signature: $s, url: $u}}}' > dist/latest.json
          jq -r '.version, .platforms["linux-x86_64"].url' dist/latest.json

      - name: Create fork release and upload
        if: steps.skip.outputs.already == 'false' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.forkver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "codeg ${{ steps.forkver.outputs.forkver }} + floating-ball (fork)" \
            --notes "基于上游 ${{ steps.upstream.outputs.tag }}，含悬浮球功能与 fork 更新源补丁。打包 linux-x64 与 linux-arm64。fork 构建号 ${{ steps.forkver.outputs.forkver }}（is_newer 可见，覆盖安装不再被同版本拒绝）。

          $(cat /tmp/upstream-notes.md)" \
            "dist/${ARTIFACT}.tar.gz" \
            "dist/${ARTIFACT}.tar.gz.sig" \
            "dist/${ARTIFACT}.tar.gz.sha256" \
            dist/latest.json

  # ARM64 服务端包（NAS / 树莓派等 arm64 Linux）。等 x64 job 发布 release 和
  # latest.json 后再跑：复用同一 tag/版本号，把 arm64 三件套（tar/sig/sha256）
  # 追加到同一个 release。更新器按 releases/latest/download/<asset> 取包，所以
  # 不需要改 latest.json 的 platforms。
  #
  # 用原生 arm runner + Debian 12 容器：目标机（Armbian bookworm）glibc 2.36，
  # 若在 ubuntu-24.04 裸机构建会引入 GLIBC_2.38 符号而跑不起来。web 静态资产
  # 与架构无关，直接复用 x64 包里的那份，避免在容器里再装一套 Node/pnpm。
  build-arm64:
    needs: sync-and-release
    if: ${{ !cancelled() && (needs.sync-and-release.result == 'success' || needs.sync-and-release.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container: arm64v8/debian:12
    env:
      ARTIFACT: codeg-server-linux-arm64
    defaults:
      run:
        # Container jobs default to /bin/sh (dash); the steps use bashisms
        # (pipefail) and `set -euo pipefail`.
        shell: bash
        # Be explicit: container jobs have been observed running run-steps
        # outside the checked-out workspace, which makes `git config` fail
        # with "not in a git directory".
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev git curl ca-certificates jq gh \
            nodejs npm file python3

      - name: Resolve the release the x64 job just published
        id: rel
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
            --jq '[.[] | select(.tag_name | contains("+fork."))] | sort_by(.created_at) | last | .tag_name')
          test -n "$tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output /tmp/latest.json --clobber
          ver=$(jq -r .version /tmp/latest.json)
          test -n "$ver"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -qx "${ARTIFACT}.tar.gz"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "arm64 assets already on $tag — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "ARM64 build for $tag (version $ver)"

      - name: Check out deploy branch
        if: steps.rel.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: deploy/fork-updater
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Mark workspace safe for git
        if: steps.rel.outputs.skip == 'false'
        run: |
          # The container runs as root while checkout leaves the tree owned by
          # the runner user; checkout's own safe.directory entry lives in a
          # temporary HOME and does not reach later steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Merge the same upstream tag the x64 job used
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # release tag "0.38.0+fork.3" -> upstream tag "v0.38.0"
          upstream_tag="v${{ steps.rel.outputs.tag }}"
          upstream_tag="${upstream_tag%%+*}"
          git config user.name "fork-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/spacering-net/codeg.git
          git fetch upstream "$upstream_tag"
          git merge --no-edit FETCH_HEAD

      - name: Stamp fork version into build inputs
        if: steps.rel.outputs.skip == 'false'
        env:
          VER: ${{ steps.rel.outputs.ver }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sed -i "0,/^version = \".*\"/s//version = \"${VER}\"/" src-tauri/Cargo.toml
          grep -q "^version = \"${VER}\"" src-tauri/Cargo.toml
          python3 - "$VER" <<'EOF'
          import sys
          ver = sys.argv[1]
          lines = open("src-tauri/Cargo.lock").read().split("\n")
          hits = [i for i, line in enumerate(lines) if line == 'name = "codeg"']
          assert len(hits) == 1, f'expected exactly one "codeg" entry, found {len(hits)}'
          i = hits[0]
          assert lines[i + 1].startswith("version = "), f"unexpected lock layout at line {i}"
          lines[i + 1] = f'version = "{ver}"'
          open("src-tauri/Cargo.lock", "w").write("\n".join(lines))
          for path in ("src-tauri/tauri.conf.json", "package.json"):
              text = open(path).read()
              needle = '"version": "0.38.0"'
              assert text.count(needle) == 1, f"expected one version field in {path}"
              open(path, "w").write(text.replace(needle, f'"version": "{ver}"'))
          EOF
          grep "\"version\": \"${VER}\"" src-tauri/tauri.conf.json package.json
          grep -A1 '^name = "codeg"$' src-tauri/Cargo.lock | head -2

      - name: Set up Rust
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build arm64 server + companions
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src-tauri"
          cargo build --release --bin codeg-server --no-default-features --features server-bin
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin
          cd ..
          mkdir -p dist/${ARTIFACT}
          cp src-tauri/target/release/codeg-server dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-mcp dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-computer-helper dist/${ARTIFACT}/
          cp src-tauri/target/release/codeg-cli dist/${ARTIFACT}/
          chmod +x dist/${ARTIFACT}/*

      - name: Reuse the architecture-independent web assets
        if: steps.rel.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release download "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern codeg-server-linux-x64.tar.gz --output /tmp/x64.tar.gz --clobber
          mkdir -p dist/web-src
          tar xzf /tmp/x64.tar.gz -C dist/web-src --strip-components=1 codeg-server-linux-x64/web
          mv dist/web-src/web dist/${ARTIFACT}/web
          rmdir dist/web-src
          cd dist && tar czf ${ARTIFACT}.tar.gz ${ARTIFACT}

      - name: Smoke test packaged artifact
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -x "dist/${ARTIFACT}/codeg-server"
          test -x "dist/${ARTIFACT}/codeg-mcp"
          test -x "dist/${ARTIFACT}/codeg-computer-helper"
          test -x "dist/${ARTIFACT}/codeg-cli"
          test -f "dist/${ARTIFACT}/web/index.html"
          file "dist/${ARTIFACT}/codeg-server" | grep -q "ARM aarch64"

      - name: Sign bundle with fork key
        if: steps.rel.outputs.skip == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npm install -g @tauri-apps/cli@2 >/tmp/npm-tauri.log 2>&1 || { tail -50 /tmp/npm-tauri.log; exit 1; }
          tauri signer sign --app-version "${{ steps.rel.outputs.ver }}" "dist/${ARTIFACT}.tar.gz"
          test -f "dist/${ARTIFACT}.tar.gz.sig"
          ( cd dist && sha256sum ${ARTIFACT}.tar.gz > ${ARTIFACT}.tar.gz.sha256 )

      - name: Upload arm64 assets to the same release
        if: steps.rel.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release upload "${{ steps.rel.outputs.tag }}" \
            "dist/${ARTIFACT}.tar.gz" \
            "dist/${ARTIFACT}.tar.gz.sig" \
            "dist/${ARTIFACT}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
